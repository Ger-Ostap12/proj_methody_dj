{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header">Восстановление пароля</div>
            <div class="card-body">
                <p class="text-muted">Введите email, указанный при регистрации.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary mt-2">Отправить ссылку</button>
                </form>
                <p class="mt-3 mb-0">
                    <a href="{% url 'login' %}">Вернуться ко входу</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
