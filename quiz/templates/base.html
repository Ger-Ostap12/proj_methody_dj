<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Онлайн-тесты{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4 mb-5">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}">Онлайн-тесты</a>
                <div class="navbar-nav ms-auto flex-row flex-wrap gap-2 align-items-center">
                    {% if user.is_authenticated %}
                        <span class="navbar-text me-2">{{ user.username }}</span>
                        <a class="nav-link py-1" href="{% url 'password_change' %}">Смена пароля</a>
                        {% if user.is_staff %}
                            <a class="nav-link py-1" href="{% url 'admin:index' %}">Админка</a>
                        {% endif %}
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link nav-link py-1 d-inline">Выйти</button>
                        </form>
                    {% else %}
                        <a class="nav-link py-1" href="{% url 'register' %}">Регистрация</a>
                        <a class="nav-link py-1" href="{% url 'login' %}">Войти</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        {% if messages %}
            <div class="messages mb-4">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
